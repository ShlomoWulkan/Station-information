[tool.ruff]
line-length = 100
target-version = "py39"
exclude = ["venv", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes — כולל ייבוא לא בשימוש, שהיה כאן
    "W",   # warnings
    "I",   # isort
    "B",   # bugbear — כולל except חשוף ו-mutable default args
    "UP",  # pyupgrade
    "SIM", # simplify
]
ignore = [
    # תיעוד בעברית: ruff מודד אורך בתווים, ואין בעיית קריאות אמיתית.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# הבדיקות תופסות חריגות רחבות בכוונה, כדי לאמת שכלום לא נזרק.
"tests/*" = ["BLE001", "S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# הבדיקות אינן טוענות GTFS, ולכן צריכות להיות מהירות. חריגה מזה היא סימן.
addopts = "-q --durations=3"
